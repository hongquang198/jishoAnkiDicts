name: release

# Ship flow: merge main into `release` (or push to it directly).
# Test -> signed APK + AAB -> published Release with auto-notes.
on:
  push:
    branches: ['release']

permissions:
  contents: write # gh-release needs it to publish the Release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: flutter test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      # Prod flavor only: it matches the registered Firebase clients.
      # (Unflavored `apk --release` also builds devRelease, whose .dev
      # package has no google-services entry — the CI failure that taught this.)
      - run: flutter build apk --release --flavor prod
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: flutter build appbundle --release --flavor prod
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          files: dist/*
          generate_release_notes: true
