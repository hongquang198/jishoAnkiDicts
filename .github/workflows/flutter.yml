name: flutter

on:
  push:
    paths: ['lib/**', 'test/**', 'pubspec.yaml', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['lib/**', 'test/**', 'pubspec.yaml', '.github/workflows/flutter.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the locally verified version (3.47.0): a floating channel
      # breaks reproducibility — today's green must mean tomorrow's green.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      # Advisory until the codebase is fully clean.
      - run: flutter analyze
        continue-on-error: true
      # Full suite: the 3 formerly-broken files were fixed (missing l10n
      # delegates, missing bloc provider, stale label expectations), and the
      # irrelevant default widget_test.dart was deleted.
      - run: flutter test

  # Release APK on every green push to main, signed with the upload keystore
  # (secrets-gated: no keys in git; debug fallback only exists locally).
  build-apk:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
      - run: flutter pub get
      - run: echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: flutter build apk --release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
