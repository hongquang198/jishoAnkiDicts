# FILE: alembic.ini — migration runner config (Session 14).
# Points Alembic at your DATABASE_URL; `alembic upgrade head` creates tables
# from app/models/db.py without hand-writing SQL.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://jisho:jisho@localhost:5432/jisho

# Logging sections required by env.py's fileConfig() call.
# Without these, Alembic crashes with KeyError: 'formatters' before migrating.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
