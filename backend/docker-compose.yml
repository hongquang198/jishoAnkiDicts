# FILE: docker-compose.yml — one command runs api + Postgres + Redis together.
# Run: docker compose up --build (Session 14). Data survives restarts (pgdata).
# NOTE: inside compose the API reaches the DB at host "db", not localhost.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside compose the DB host is "db", not localhost — this overrides .env.
      DATABASE_URL: postgresql+psycopg://jisho:jisho@db:5432/jisho
    depends_on:
      - db
  db:
    # Alpine variant: same Postgres 16, smaller image. Plain :16 (Debian)
    # fails here with "exec format error" — environment quirk, see S14 notes.
    image: postgres:16-alpine
    restart: unless-stopped # survive reboots: Docker was asleep, not the DB
    environment:
      POSTGRES_USER: jisho
      POSTGRES_PASSWORD: jisho
      POSTGRES_DB: jisho
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Database browser (dev only): pgAdmin web UI at http://localhost:5050
  # login admin@example.com / admin, then Add Server with host "db" (compose
  # network name — same reason the api container uses host "db", S14).
  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      # host:container — pgAdmin serves :80 inside; exposed as :5050 outside.
      - "5050:80"
    depends_on:
      - db
  # P2.2: shared memory for cache + quotas + rate-limit budgets.
  # API reaches it at host "redis" (compose network); local dev uses localhost.
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  pgdata:
